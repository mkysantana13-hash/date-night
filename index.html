<style>
  :root{
    --night:#1E1740;
    --night-deep:#140F2E;
    --surface:#2C2358;
    --amber:#FFC24B;
    --coral:#FF6B6B;
    --mint:#6BE3C0;
    --lilac:#B79CFF;
    --cream:#F7F2E7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #33265F 0%, var(--night) 45%, var(--night-deep) 100%);
    color:var(--cream);
    font-family:'Karla',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 20px 64px;
  }
  .wrap{width:100%;max-width:460px;text-align:center}

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:clamp(2.1rem,9vw,2.9rem);
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:-0.015em;
  }
  .sub{
    font-size:1rem;
    line-height:1.55;
    color:#CFC5EE;
    margin:0 auto 30px;
    max-width:30ch;
  }

  /* wheel */
  .stage{position:relative;display:inline-block;margin-bottom:8px}
  .needle{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;z-index:3;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:24px solid var(--coral);
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
  }
  .rim{
    padding:9px;border-radius:50%;
    background:linear-gradient(160deg,var(--amber),#C9873A 55%,var(--amber));
    box-shadow:0 18px 44px rgba(10,6,30,.6);
  }
  canvas{display:block;border-radius:50%;background:var(--surface)}
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:86px;height:86px;border-radius:50%;
    border:5px solid var(--amber);
    background:var(--night-deep);
    color:var(--cream);
    font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;
    cursor:pointer;z-index:2;
    transition:transform .12s ease;
  }
  .hub:hover{transform:translate(-50%,-50%) scale(1.05)}
  .hub:active{transform:translate(-50%,-50%) scale(.96)}
  .hub:disabled{cursor:default;opacity:.75}

  .switchrow{display:flex;gap:4px;justify-content:center;align-items:center;margin-top:2px;flex-wrap:wrap}
  .switch.on{color:var(--amber);text-decoration-color:var(--amber)}
  .plan ol{list-style:none;margin:0;padding:0;counter-reset:step}
  .plan ol li{
    counter-increment:step;
    display:flex;align-items:center;gap:10px;
    padding:11px 0;border-top:1px solid rgba(255,255,255,.09);
    font-size:1rem;color:var(--cream);
  }
  .plan ol li::before{
    content:counter(step);
    flex:none;width:26px;height:26px;border-radius:50%;
    background:var(--night-deep);color:var(--amber);
    font-size:.8rem;display:flex;align-items:center;justify-content:center;
  }
  .plan ol li span{flex:1;min-width:0}
  .plan ol li button{
    flex:none;background:none;border:1px solid rgba(255,255,255,.2);
    color:#C3B6EA;border-radius:999px;padding:6px 12px;
    font-family:'Karla',sans-serif;font-size:.8rem;cursor:pointer;
  }
  .plan .row{margin-top:16px}

  .switch{
    background:none;border:0;color:#C3B6EA;
    font-family:'Karla',sans-serif;font-size:.95rem;
    text-decoration:underline;text-underline-offset:4px;
    cursor:pointer;padding:10px;margin-top:6px;
  }
  .switch:hover{color:var(--cream)}

  /* menu */
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .menu button{
    background:var(--surface);border:1px solid rgba(183,156,255,.3);
    color:var(--cream);border-radius:14px;padding:16px 12px;
    font-family:'Fraunces',serif;font-size:1rem;font-weight:600;
    cursor:pointer;transition:background .15s ease,border-color .15s ease;
  }
  .menu button:hover{background:#372C6B;border-color:var(--amber)}

  /* result */
  .card{
    margin-top:26px;padding:24px 20px;
    background:var(--surface);
    border-radius:20px;
    border:1px solid rgba(255,194,75,.28);
    text-align:left;
  }
  .card h2{
    font-family:'Fraunces',serif;font-weight:700;
    font-size:1.6rem;margin:0 0 16px;color:var(--amber);
  }
  .card p{margin:0 0 18px;color:#D6CDF2;line-height:1.55;font-size:.98rem}
  .ideas{display:flex;flex-direction:column;gap:9px}
  .idea{display:flex;gap:8px;align-items:stretch}
  .pickbtn{
    flex:1;min-width:0;
    display:flex;align-items:center;gap:12px;text-align:left;
    background:var(--night-deep);
    border:1px solid rgba(107,227,192,.25);
    color:var(--cream);border-radius:12px;padding:11px 14px;
    font-family:'Karla',sans-serif;font-size:1rem;cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
  }
  .pickbtn:hover{border-color:var(--mint);background:#1B1440}
  .pickbtn img{
    flex:none;width:46px;height:46px;border-radius:8px;object-fit:cover;
    background:#2B2350;
  }
  .rev{
    flex:none;display:flex;align-items:center;
    padding:0 14px;border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    color:#C3B6EA;text-decoration:none;font-size:.82rem;
  }
  .rev:hover{border-color:var(--amber);color:var(--amber)}

  .custom{display:flex;gap:8px;margin-top:14px}
  .custom input{
    flex:1;min-width:0;
    background:var(--night-deep);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:13px 15px;
    color:var(--cream);font-family:'Karla',sans-serif;font-size:1rem;
  }
  .custom input::placeholder{color:#8D82B8}
  .custom input:focus{border-color:var(--mint);outline:none}
  .custom button{
    border:0;border-radius:12px;padding:0 18px;
    background:var(--mint);color:#14213A;
    font-family:'Karla',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;
  }

  .keep{
    display:flex;align-items:center;gap:9px;
    margin-top:12px;color:#B4A8DC;font-size:.88rem;cursor:pointer;
  }
  .keep input{accent-color:var(--mint);width:18px;height:18px}

  .locked{text-align:center;padding:30px 22px}
  .locked .label{font-size:.95rem;color:var(--mint);margin-bottom:10px}
  .locked .pick{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;
    line-height:1.25;margin:0 0 22px;
  }
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{
    border-radius:999px;padding:12px 20px;cursor:pointer;
    font-family:'Karla',sans-serif;font-size:.95rem;font-weight:700;
    border:1px solid var(--amber);background:var(--amber);color:#221741;
  }
  .btn.ghost{background:transparent;color:var(--cream);border-color:rgba(255,255,255,.3)}

  .used{
    margin:22px auto 0;max-width:100%;text-align:left;
    background:rgba(0,0,0,.18);border-radius:14px;padding:4px 14px;
  }
  .used summary{
    cursor:pointer;padding:12px 0;color:#B4A8DC;font-size:.92rem;
    list-style:none;
  }
  .used summary::-webkit-details-marker{display:none}
  .used summary::after{content:" ▾";color:#7E71AE}
  .used[open] summary::after{content:" ▴"}
  .used ul{list-style:none;margin:0;padding:0 0 10px}
  .used li{
    display:flex;align-items:center;gap:10px;
    padding:9px 0;border-top:1px solid rgba(255,255,255,.07);
    font-size:.95rem;color:#CFC5EE;
  }
  .used li span{flex:1;min-width:0}
  .used li button{
    flex:none;background:none;border:1px solid rgba(255,255,255,.22);
    color:var(--cream);border-radius:999px;padding:6px 12px;
    font-family:'Karla',sans-serif;font-size:.82rem;cursor:pointer;
  }
  .used li button:hover{border-color:var(--mint);color:var(--mint)}

  :focus-visible{outline:3px solid var(--mint);outline-offset:3px}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){
    canvas{transition:none !important}
  }
</style>

<body>
<div class="wrap">
  <h1 id="headline">Let’s pick our next date twincess</h1>

  <!-- WHEEL -->

    <div class="stage">
      <div class="needle"></div>
      <div class="rim"><canvas id="wheel" width="320" height="320"></canvas></div>
      <button class="hub" id="spin">Spin</button>
    </div>
    <div class="switchrow">
      <button class="switch" id="toMenu">I'd rather just pick</button>
      <button class="switch" id="combo">Combo night</button>
      <button class="switch" id="mute">Sound on</button>
    </div>
  </div>

  <!-- MENU -->
  <div id="menuView" class="hidden">
    <div class="menu" id="menu"></div>
    <button class="switch" id="toWheel">Back to the wheel</button>
  </div>

  <!-- RESULT -->
  <div id="planBox"></div>
  <div id="result"></div>
  <div id="usedBox"></div>
</div>

<script>
/* ---------- edit this part ----------
   n   = name shown

   q   = plain search text (use instead of id for areas, not single businesses)
   img = optional image URL for a thumbnail
------------------------------------- */

const GENRES = [

    { n:"Kings bowling on I-Drive", id:"ChIJ4XQ3d1N-54gRDFCoQUDsMUs" },

  ]},
  { short:"Movies", title:"Movies", ideas:[

    { n:"AmStar Lake Mary", id:"ChIJBTRHN0AN54gRsDT79N1crAs" },
    { n:"Enzian Theater, Maitland", id:"ChIJ-WLCqkdw54gR5FyZzXYSoV4" },
    { n:"Silver Moon Drive-In, Lakeland", id:"ChIJ1dJMdEc43YgRmII076Tbhmg" },
    { n:"Movie at home, you pick" }
  ]},
  { short:"Your call", title:"Your call", ideas:[

    { n:"Surprise me" },
    { n:"Text me the plan" }
  ]}
];
/* ------------------------------------ */

const SEG = 360 / GENRES.length;
const PALETTE = ["#3B2E73","#4A3A8C","#332764","#574496"];
const ACCENTS = ["#FFC24B","#6BE3C0","#B79CFF","#FF6B6B"];

function mapUrl(idea){
  if (idea.id) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(idea.n)}&query_place_id=${idea.id}`;
  if (idea.q)  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(idea.q)}`;
  return null;
}

/* ---- used ideas, remembered between visits ---- */
const STORE = "datenight.used.v1";
const CUSTOM = "datenight.custom.v1";
let used = new Set();
let customs = {};
try { used = new Set(JSON.parse(localStorage.getItem(STORE) || "[]")); } catch (e) {}
try { customs = JSON.parse(localStorage.getItem(CUSTOM) || "{}"); } catch (e) {}
function persist(){ try { localStorage.setItem(STORE, JSON.stringify([...used])); } catch (e) {} }
function persistCustom(){ try { localStorage.setItem(CUSTOM, JSON.stringify(customs)); } catch (e) {} }
function key(gi, name){ return gi + "|" + name; }
function allIdeas(gi){
  const extra = (customs[gi] || []).map(n => ({ n: n, mine: true }));
  return GENRES[gi].ideas.concat(extra);
}
function remaining(gi){ return allIdeas(gi).filter(idea => !used.has(key(gi, idea.n))); }

const cv = document.getElementById("wheel");
const ctx = cv.getContext("2d");

function sizeWheel(){
  const css = Math.min(320, window.innerWidth - 90);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = css + "px";
  cv.style.height = css + "px";
  cv.width = css * dpr;
  cv.height = css * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw(css);
}

function draw(size){
  const r = size/2, rad = SEG * Math.PI/180;
  ctx.clearRect(0,0,size,size);
  GENRES.forEach((g,i)=>{
    const start = -Math.PI/2 - rad/2 + i*rad;
    const spent = remaining(i).length === 0;

    ctx.beginPath();
    ctx.moveTo(r,r);
    ctx.arc(r,r,r,start,start+rad);
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.10)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const mid = start + rad/2;
    const m = ((mid % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    const flip = m > Math.PI/2 && m < Math.PI*1.5;

    ctx.save();
    ctx.translate(r,r);
    ctx.rotate(mid);
    if (flip) ctx.rotate(Math.PI);
    ctx.textAlign = flip ? "left" : "right";
    ctx.textBaseline = "middle";
    ctx.globalAlpha = spent ? 0.35 : 1;
    ctx.fillStyle = ACCENTS[i % ACCENTS.length];

    let fs = Math.max(11, size*0.055);
    const maxW = r*0.62;
    ctx.font = `600 ${fs}px Fraunces, Georgia, serif`;
    while (ctx.measureText(g.short).width > maxW && fs > 9){
      fs -= 1;
      ctx.font = `600 ${fs}px Fraunces, Georgia, serif`;
    }
    ctx.fillText(g.short, flip ? -r*0.88 : r*0.88, 0);
    ctx.restore();
  });
}

let rotation = 0, spinning = false, lastSpin = -1;
const spinBtn = document.getElementById("spin");
const result = document.getElementById("result");
const usedBox = document.getElementById("usedBox");

function refreshWheel(){
  sizeWheel();
  cv.style.transform = `rotate(${rotation}deg)`;
}

/* ---- sound ---- */
let actx = null, muted = false;
try { muted = localStorage.getItem("datenight.muted") === "1"; } catch (e) {}

function audio(){
  if (muted) return null;
  try {
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}

function tick(){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = "square";
  o.frequency.value = 1500;
  g.gain.setValueAtTime(0.05, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.045);
  o.connect(g); g.connect(a.destination);
  o.start();
  o.stop(a.currentTime + 0.05);
}

function chime(){
  const a = audio(); if (!a) return;
  [660, 880, 1320].forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.value = f;
    const t = a.currentTime + i * 0.09;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(a.destination);
    o.start(t);
    o.stop(t + 0.4);
  });
}

function currentDeg(){
  const st = getComputedStyle(cv).transform;
  if (!st || st === "none") return 0;
  const m = st.match(/matrix\(([^)]+)\)/);
  if (!m) return 0;
  const p = m[1].split(",").map(Number);
  return Math.atan2(p[1], p[0]) * 180 / Math.PI;
}

function trackTicks(){
  let last = null;
  const step = () => {
    if (!spinning) return;
    const deg = ((currentDeg() % 360) + 360) % 360;
    const idx = Math.round(((360 - deg) % 360) / SEG);
    if (last === null) last = idx;
    else if (idx !== last){ tick(); last = idx; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const muteBtn = document.getElementById("mute");
muteBtn.textContent = muted ? "Sound off" : "Sound on";
muteBtn.addEventListener("click", () => {
  muted = !muted;
  muteBtn.textContent = muted ? "Sound off" : "Sound on";
  try { localStorage.setItem("datenight.muted", muted ? "1" : "0"); } catch (e) {}
  if (!muted) tick();
});

function nextTarget(){
  let pool = GENRES.map((g,i) => i).filter(i => remaining(i).length > 0);
  if (!pool.length) pool = GENRES.map((g,i) => i);
  if (pool.length > 1){
    const trimmed = pool.filter(i => i !== lastSpin);
    if (trimmed.length) pool = trimmed;
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

spinBtn.addEventListener("click", () => {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;
  result.innerHTML = "";

  const target = nextTarget();
  lastSpin = target;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const turns = reduced ? 1 : 5 + Math.floor(Math.random()*3);
  const landing = (360 - target * SEG) % 360;
  const next = rotation - (rotation % 360) + turns*360 + landing;
  const dur = reduced ? 400 : 4200;

  cv.style.transition = `transform ${dur}ms cubic-bezier(.16,.84,.28,1)`;
  cv.style.transform = `rotate(${next}deg)`;
  rotation = next;
  trackTicks();

  setTimeout(() => {
    spinning = false;
    spinBtn.disabled = false;
    spinBtn.textContent = "Again";
    chime();
    showGenre(target);
  }, dur + 120);
});

function showGenre(gi){
  const g = GENRES[gi];
  const left = remaining(gi);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${g.title}</h2><div class="ideas"></div>`;
  const box = card.querySelector(".ideas");

  if (!left.length){
    const note = document.createElement("p");
    note.textContent = "We've done all of these. Write something new, or put one back below.";
    box.appendChild(note);
  }

  left.forEach(idea => {
    const row = document.createElement("div");
    row.className = "idea";

    const pick = document.createElement("button");
    pick.className = "pickbtn";
    if (idea.img){
      const im = document.createElement("img");
      im.src = idea.img;
      im.alt = "";
      im.loading = "lazy";
      im.addEventListener("error", () => im.remove());
      pick.appendChild(im);
    }
    const label = document.createElement("span");
    label.textContent = idea.n;
    pick.appendChild(label);
    pick.addEventListener("click", () => lockIn(gi, idea.n, true));
    row.appendChild(pick);

    const url = mapUrl(idea);
    if (url){
      const a = document.createElement("a");
      a.className = "rev";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Reviews";
      a.setAttribute("aria-label", `Reviews and photos for ${idea.n}`);
      row.appendChild(a);
    }

    box.appendChild(row);
  });

  const custom = document.createElement("div");
  custom.className = "custom";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Or write your own";
  input.setAttribute("aria-label", "Your own idea");
  const add = document.createElement("button");
  add.textContent = "Use this";
  const submit = () => {
    const val = input.value.trim();
    if (!val) { input.focus(); return; }
    if (keep.checked && !(customs[gi] || []).includes(val)){
      customs[gi] = (customs[gi] || []).concat(val);
      persistCustom();
    }
    lockIn(gi, val, keep.checked);
  };
  add.addEventListener("click", submit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  custom.appendChild(input);
  custom.appendChild(add);
  card.appendChild(custom);

  const keepRow = document.createElement("label");
  keepRow.className = "keep";
  const keep = document.createElement("input");
  keep.type = "checkbox";
  keep.checked = true;
  const keepText = document.createElement("span");
  keepText.textContent = "Keep this on the list for next time";
  keepRow.appendChild(keep);
  keepRow.appendChild(keepText);
  card.appendChild(keepRow);

  result.innerHTML = "";
  result.appendChild(card);
  card.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function sendLink(text){
  const apple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
  return `sms:${PHONE}${apple ? "&" : "?"}body=${encodeURIComponent(text)}`;
}

/* ---- combo night ---- */
let combo = false;
let plan = [];
const planBox = document.getElementById("planBox");
const comboBtn = document.getElementById("combo");

comboBtn.addEventListener("click", () => {
  combo = !combo;
  plan = [];
  comboBtn.textContent = combo ? "One thing only" : "Combo night";
  comboBtn.classList.toggle("on", combo);
  result.innerHTML = "";
  spinBtn.textContent = "Spin";
  renderPlan();
});

function renderPlan(){
  planBox.innerHTML = "";
  if (!combo) return;

  const box = document.createElement("div");
  box.className = "card plan";
  const h = document.createElement("h2");
  h.textContent = plan.length ? "The night so far" : "Combo night";
  box.appendChild(h);

  if (!plan.length){
    const p = document.createElement("p");
    p.textContent = "Spin or pick as many times as you want. Everything you choose stacks up here.";
    box.appendChild(p);
  } else {
    const ol = document.createElement("ol");
    plan.forEach((n, i) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.textContent = n;
      const x = document.createElement("button");
      x.textContent = "Remove";
      x.addEventListener("click", () => { plan.splice(i, 1); renderPlan(); });
      li.appendChild(s);
      li.appendChild(x);
      ol.appendChild(li);
    });
    box.appendChild(ol);

    const row = document.createElement("div");
    row.className = "row";
    const done = document.createElement("button");
    done.className = "btn";
    done.textContent = "That's the night";
    done.addEventListener("click", finishCombo);
    row.appendChild(done);
    box.appendChild(row);
  }
  planBox.appendChild(box);
}

function finishCombo(){
  if (!plan.length) return;
  const joined = plan.join(" → ");
  const text = `Our next date: ${joined}`;

  const card = document.createElement("div");
  card.className = "card locked";
  card.innerHTML = `
    <div class="label">That's the plan</div>
    <p class="pick">${joined}</p>
    <div class="row">
      <a class="btn" href="${sendLink(text)}">Send it to me</a>
      <button class="btn ghost" id="save">Save image</button>
      <button class="btn ghost" id="redo">Start over</button>
    </div>`;
  planBox.innerHTML = "";
  result.innerHTML = "";
  result.appendChild(card);

  const items = plan.slice();
  card.querySelector("#save").addEventListener("click", (e) => {
    saveCard(items.join("  ·  "), "Combo night", e.target);
  });
  card.querySelector("#redo").addEventListener("click", () => {
    plan = [];
    result.innerHTML = "";
    spinBtn.textContent = "Spin";
    renderPlan();
  });
  card.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function wrapLines(c, text, font, maxWidth){
  c.font = font;
  const words = text.split(" ");
  const lines = [];
  let line = "";
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if (c.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

async function saveCard(name, genre, btn){
  const label = btn.textContent;
  btn.textContent = "Working…";
  try { await document.fonts.ready; } catch (e) {}

  const W = 1080, H = 1350;
  const c2 = document.createElement("canvas");
  c2.width = W; c2.height = H;
  const c = c2.getContext("2d");

  const bg = c.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#33265F");
  bg.addColorStop(0.55, "#1E1740");
  bg.addColorStop(1, "#140F2E");
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);

  c.strokeStyle = "rgba(255,194,75,.55)";
  c.lineWidth = 4;
  c.strokeRect(46, 46, W - 92, H - 92);

  c.textAlign = "center";

  c.fillStyle = "#6BE3C0";
  c.font = "500 34px Karla, system-ui, sans-serif";
  c.fillText("That's the plan", W/2, 250);

  let size = 108;
  let lines = wrapLines(c, name, `600 ${size}px Fraunces, Georgia, serif`, W - 240);
  while (lines.length > 4 && size > 52){
    size -= 8;
    lines = wrapLines(c, name, `600 ${size}px Fraunces, Georgia, serif`, W - 240);
  }
  c.fillStyle = "#F7F2E7";
  c.font = `600 ${size}px Fraunces, Georgia, serif`;
  const lh = size * 1.2;
  const startY = H/2 - ((lines.length - 1) * lh)/2;
  lines.forEach((l, i) => c.fillText(l, W/2, startY + i*lh));

  c.fillStyle = "#FFC24B";
  c.font = "500 38px Karla, system-ui, sans-serif";
  c.fillText(genre, W/2, H - 300);

  c.fillStyle = "#B4A8DC";
  c.font = "400 30px Karla, system-ui, sans-serif";
  c.fillText(new Date().toLocaleDateString(undefined, {month:"long", day:"numeric", year:"numeric"}), W/2, H - 230);

  c2.toBlob(async (blob) => {
    if (!blob){ btn.textContent = label; return; }
    const file = new File([blob], "date-night.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file] });
        btn.textContent = label;
        return;
      } catch (e) {
        btn.textContent = label;
        return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "date-night.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    btn.textContent = label;
  }, "image/png");
}

function lockIn(gi, name, fromList){
  if (fromList){
    used.add(key(gi, name));
    persist();
    renderUsed();
    refreshWheel();
  }

  if (combo){
    plan.push(name);
    result.innerHTML = "";
    spinBtn.textContent = "Spin";
    renderPlan();
    return;
  }

  const text = `Our next date: ${name}`;
  const card = document.createElement("div");
  card.className = "card locked";
  card.innerHTML = `
    <div class="label">That's the plan</div>
    <p class="pick">${name}</p>
    <div class="row">
      <a class="btn" href="${sendLink(text)}">Send it to me</a>
      <button class="btn ghost" id="save">Save image</button>
      <button class="btn ghost" id="redo">Start over</button>
    </div>`;
  result.innerHTML = "";
  result.appendChild(card);

  card.querySelector("#save").addEventListener("click", (e) => {
    saveCard(name, GENRES[gi].title, e.target);
  });
  card.querySelector("#redo").addEventListener("click", () => {
    result.innerHTML = "";
    spinBtn.textContent = "Spin";
  });
  card.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function renderUsed(){
  usedBox.innerHTML = "";
  if (!used.size) return;

  const box = document.createElement("details");
  box.className = "used";
  const sum = document.createElement("summary");
  sum.textContent = `Already used (${used.size})`;
  box.appendChild(sum);

  const list = document.createElement("ul");
  [...used].forEach(k => {
    const name = k.slice(k.indexOf("|") + 1);
    const li = document.createElement("li");
    const label = document.createElement("span");
    label.textContent = name;
    const back = document.createElement("button");
    back.textContent = "Put back";
    back.addEventListener("click", () => {
      used.delete(k);
      persist();
      renderUsed();
      refreshWheel();
    });
    li.appendChild(label);
    li.appendChild(back);
    list.appendChild(li);
  });
  box.appendChild(list);
  usedBox.appendChild(box);
}

/* menu mode */
const menu = document.getElementById("menu");
GENRES.forEach((g,i) => {
  const b = document.createElement("button");
  b.textContent = g.title;
  b.addEventListener("click", () => showGenre(i));
  menu.appendChild(b);
});

const wheelView = document.getElementById("wheelView");
const menuView = document.getElementById("menuView");
document.getElementById("toMenu").addEventListener("click", () => {
  wheelView.classList.add("hidden"); menuView.classList.remove("hidden"); result.innerHTML = "";
});
document.getElementById("toWheel").addEventListener("click", () => {
  menuView.classList.add("hidden"); wheelView.classList.remove("hidden"); result.innerHTML = "";
});

sizeWheel();
renderUsed();
window.addEventListener("resize", () => {
  const t = cv.style.transform;
  cv.style.transition = "none";
  sizeWheel();
  cv.style.transform = t;
});
</script>
